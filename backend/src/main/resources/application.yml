server:
  port: 8080

spring:
  cache:
    type: caffeine
    cache-names:
      - products
      - productById
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

dummyjson:
  base-url: https://dummyjson.com
  connect-timeout: 2s
  read-timeout: 5s
